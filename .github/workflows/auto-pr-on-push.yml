name: Auto Create PR on Push

on:
  push:
    branches-ignore:
      - master

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              base: 'master',
              state: 'open'
            });

            if (pulls.length === 0) {
              const branchName = context.ref.replace('refs/heads/', '');
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Auto PR: ${branchName}`,
                head: branchName,
                base: 'master',
                body: `Automated pull request created from branch \`${branchName}\`\n\nThis PR was automatically created by the workflow and requires manual approval before deployment.`
              });
              console.log('Pull request created successfully');
            } else {
              console.log('Pull request already exists');
            }
